name: Mobile Appium CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  android-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Node.js (for Appium)
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install Appium & Android Driver
      run: |
        npm install -g appium
        appium driver install uiautomator2

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install Appium-Python-Client pytest pytest-html pytest-rerunfailures

    - name: Start Appium Server (Background)
      run: |
        appium &
        sleep 5

    - name: Run Pytest with Auto-Retries
      run: |
        pytest --reruns 2 --html=reports/report.html --self-contained-html

    - name: Upload Test Report Artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: html-test-report
        path: reports/report.html
        
    - name: Send Slack Notification
      uses: slackapi/slack-github-action@v1.26.0
      with:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      if: always()
